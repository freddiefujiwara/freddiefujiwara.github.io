name: Deploy staging preview

on:
  push:
    branches-ignore: ["master"]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 20.x
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - run: npm install
    - run: npm test

    - name: Build staging variant
      run: npm run build:staging

    - name: "Deploy staging to gh-pages 🚀"
      uses: JamesIves/github-pages-deploy-action@releases/v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: staging-dist
        TARGET_FOLDER: staging
        CLEAN: false

  e2e:
    needs: deploy-staging
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Wait for the preview to be published
        run: sleep 60
      - name: Check the staging preview in a real browser
        env:
          HOME: /root
          APP: top
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
