name: Production smoke

on:
  schedule:
    # 06:00 JST every day
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Run smoke tests
        env:
          HOME: /root
        run: npx playwright test
      - name: Measure pages, articles and endpoints
        if: always()
        env:
          SMOKE_RECORD_TOKEN: ${{ secrets.SMOKE_RECORD_TOKEN }}
        run: node scripts/measure-smoke.mjs
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 7
