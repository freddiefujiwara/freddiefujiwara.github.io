name: Deploy to gh-pages

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Assemble publish folder (production + staging variant)
      run: |
        npm install
        npm run build:staging
        mkdir publish
        cp -r public/. publish/
        mkdir publish/staging
        cp -r staging-dist/. publish/staging/

    - name: "Deploy to gh-pages 🚀"
      uses: JamesIves/github-pages-deploy-action@releases/v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: publish
