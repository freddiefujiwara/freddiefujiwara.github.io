name: GAS marker audit

on:
  schedule:
    # 06:15 JST every Monday
    - cron: "15 21 * * 0"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit GAS main branches for rollback markers
        run: node scripts/audit-gas-markers.mjs
